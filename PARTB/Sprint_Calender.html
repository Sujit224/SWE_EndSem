<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Calendar: Clean View</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --border: #334155;
            
            /* Sprint Theme Colors */
            --cyan: #06b6d4; --cyan-fade: rgba(6,182,212,0.1);
            --purple: #8b5cf6; --purple-fade: rgba(139,92,246,0.1);
            --pink: #ec4899; --pink-fade: rgba(236,72,153,0.1);
            --orange: #f97316; --orange-fade: rgba(249,115,22,0.1);
            --yellow: #eab308; --yellow-fade: rgba(234,179,8,0.1);
            --green: #22c55e; --green-fade: rgba(34,197,94,0.1);
            --red: #ef4444; --red-fade: rgba(239,68,68,0.1);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            padding: 40px;
            margin: 0;
        }

        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 50px;
        }

        /* --- SPRINT SECTION --- */
        .sprint-section {
            margin-bottom: 60px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            background: rgba(30, 41, 59, 0.3);
        }

        .sprint-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .sprint-title {
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .sprint-dates {
            font-size: 1rem;
            color: #cbd5e1;
            background: rgba(255,255,255,0.05);
            padding: 6px 15px;
            border-radius: 20px;
        }

        /* --- CALENDAR GRID --- */
        .days-grid {
            display: grid;
            /* Small, compact cards */
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        /* --- DAY CARD --- */
        .day-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            min-height: 120px;
            transition: transform 0.2s;
            position: relative;
        }

        .day-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        .day-num { font-size: 1.1rem; font-weight: 800; color: #fff; }
        .day-date { font-size: 0.7rem; color: #94a3b8; text-transform: uppercase; }

        /* --- EVENTS --- */
        .events-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
        }

        .event-pill {
            font-size: 0.65rem;
            padding: 3px 6px;
            border-radius: 4px;
            color: #fff;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .standup {
            background: rgba(255,255,255,0.05);
            border-left: 2px solid #94a3b8;
            color: #cbd5e1;
        }

        .story-pill {
            /* Theme colors injected via JS */
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            justify-content: space-between;
        }

        .retro {
            margin-top: auto;
            background: linear-gradient(135deg, #f43f5e, #e11d48);
            text-align: center;
            font-weight: 700;
            box-shadow: 0 2px 8px rgba(244, 63, 94, 0.3);
        }

        /* Theme Colors Classes */
        .theme-cyan .sprint-title { color: var(--cyan); }
        .theme-cyan .sprint-section { border-top: 3px solid var(--cyan); }
        .theme-cyan .story-pill { background: var(--cyan-fade); border-color: var(--cyan); }

        .theme-purple .sprint-title { color: var(--purple); }
        .theme-purple .sprint-section { border-top: 3px solid var(--purple); }
        .theme-purple .story-pill { background: var(--purple-fade); border-color: var(--purple); }

        .theme-pink .sprint-title { color: var(--pink); }
        .theme-pink .sprint-section { border-top: 3px solid var(--pink); }
        .theme-pink .story-pill { background: var(--pink-fade); border-color: var(--pink); }

        .theme-orange .sprint-title { color: var(--orange); }
        .theme-orange .sprint-section { border-top: 3px solid var(--orange); }
        .theme-orange .story-pill { background: var(--orange-fade); border-color: var(--orange); }

        .theme-yellow .sprint-title { color: var(--yellow); }
        .theme-yellow .sprint-section { border-top: 3px solid var(--yellow); }
        .theme-yellow .story-pill { background: var(--yellow-fade); border-color: var(--yellow); color: #fff;}

        .theme-green .sprint-title { color: var(--green); }
        .theme-green .sprint-section { border-top: 3px solid var(--green); }
        .theme-green .story-pill { background: var(--green-fade); border-color: var(--green); }

        .theme-red .sprint-title { color: var(--red); }
        .theme-red .sprint-section { border-top: 3px solid var(--red); }
        .theme-red .story-pill { background: var(--red-fade); border-color: var(--red); }

        /* Legend */
        .legend-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 40px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        .legend-item { font-size: 0.8rem; color: #94a3b8; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 4px; }
        .legend-item b { color: #fff; margin-right: 5px; }

    </style>
</head>
<body>

    <h1>Execution Calendar 2026</h1>
    <p class="subtitle">Compact View | Jan 1, 2026 Start | Monthly Sprints</p>



    <div id="calendar-container"></div>

    <script>
        const START_YEAR = 2026;

        // Simplified Data Structure: ID + Short Title
        const sprintsConfig = [
            {
                id: 1, monthIndex: 0, theme: "theme-cyan",
                stories: [
                    { id: "US-101", title: "Registration" },
                    { id: "US-102", title: "Login Flow" },
                    { id: "US-103", title: "Validation" },
                    { id: "US-104", title: "Reset Pass" }
                ]
            },
            {
                id: 2, monthIndex: 1, theme: "theme-purple",
                stories: [
                    { id: "US-201", title: "Del Profile" },
                    { id: "US-202", title: "Location" },
                    { id: "US-203", title: "Route Map" },
                    { id: "US-204", title: "Price Est" }
                ]
            },
            {
                id: 3, monthIndex: 2, theme: "theme-pink",
                stories: [
                    { id: "US-301", title: "Select Cab" },
                    { id: "US-302", title: "Driver OTP" },
                    { id: "US-303", title: "Tracking" }
                ]
            },
            {
                id: 4, monthIndex: 3, theme: "theme-orange",
                stories: [
                    { id: "US-401", title: "Verify OTP" },
                    { id: "US-402", title: "Share Trip" },
                    { id: "US-403", title: "Cancel Trip" }
                ]
            },
            {
                id: 5, monthIndex: 4, theme: "theme-yellow",
                stories: [
                    { id: "US-501", title: "Arrival Notif" },
                    { id: "US-502", title: "Payments" },
                    { id: "US-503", title: "Completion" }
                ]
            },
            {
                id: 6, monthIndex: 5, theme: "theme-green",
                stories: [
                    { id: "US-601", title: "Rating" },
                    { id: "US-602", title: "Bill Email" },
                    { id: "US-603", title: "Emergency" }
                ]
            },
            {
                id: 7, monthIndex: 6, theme: "theme-red",
                stories: [
                    { id: "US-701", title: "Support" },
                    { id: "US-702", title: "Driver Reqs" },
                    { id: "US-703", title: "Doc Upload" }
                ]
            }
        ];

        const container = document.getElementById('calendar-container');

        function formatDate(dateObj) {
            return dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        function getActiveStory(day, totalDays, stories) {
            const segment = totalDays / stories.length;
            const index = Math.floor((day - 1) / segment);
            return stories[Math.min(index, stories.length - 1)];
        }

        sprintsConfig.forEach(sprint => {
            const section = document.createElement('div');
            section.className = `sprint-section ${sprint.theme}`;

            const startDate = new Date(START_YEAR, sprint.monthIndex, 1);
            const endDate = new Date(START_YEAR, sprint.monthIndex + 1, 0); 
            const totalDays = endDate.getDate();

            section.innerHTML = `
                <div class="sprint-header">
                    <div class="sprint-title">Sprint ${sprint.id}</div>
                    <div class="sprint-dates">
                        ${startDate.toLocaleString('default', { month: 'long' })} ${START_YEAR}
                    </div>
                </div>
                <div class="days-grid" id="grid-${sprint.id}"></div>
            `;
            container.appendChild(section);

            const grid = document.getElementById(`grid-${sprint.id}`);

            for (let d = 1; d <= totalDays; d++) {
                const currentDate = new Date(START_YEAR, sprint.monthIndex, d);
                const story = getActiveStory(d, totalDays, sprint.stories);
                const isLastDay = (d === totalDays);

                const card = document.createElement('div');
                card.className = 'day-card';
                
                let contentHtml = `
                    <div class="card-header">
                        <span class="day-num">${d}</span>
                        <span class="day-date">${formatDate(currentDate)}</span>
                    </div>
                    <div class="events-list">
                        <div class="event-pill standup">☕ Standup</div>
                        <div class="event-pill story-pill">
                            <span>${story.id}</span>
                            <span>${story.title}</span>
                        </div>
                `;

                if (isLastDay) {
                    contentHtml += `<div class="event-pill retro">🎉 RETRO</div>`;
                }

                contentHtml += `</div>`;
                card.innerHTML = contentHtml;
                grid.appendChild(card);
            }
        });

    </script>

</body>
</html>
