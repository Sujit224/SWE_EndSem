<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>900-Day Project Timeline</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --border: #334155;
            --accent: #38bdf8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            padding: 30px;
            margin: 0;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: -1px;
        }

        p.subtitle {
            color: #94a3b8;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        /* --- SPRINT ROW --- */
        .sprint-row {
            display: flex;
            margin-bottom: 40px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.3);
            overflow: hidden;
            flex-direction: column;
        }

        .sprint-info {
            padding: 20px 30px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sprint-title {
            font-size: 1.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .duration-badge {
            background: rgba(0,0,0,0.3);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: #94a3b8;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- CARDS GRID --- */
        .timeline-grid {
            display: grid;
            /* TIGHT PACKING: Columns min 160px wide */
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 20px;
        }

        .day-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 140px;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }

        .day-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }

        .day-num {
            font-size: 1.2rem;
            font-weight: 800;
            color: #fff;
        }

        .day-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #64748b;
            font-weight: 600;
        }

        /* Event Styling */
        .event {
            font-size: 0.75rem;
            padding: 6px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            line-height: 1.3;
            font-weight: 500;
        }

        .kickoff { background: rgba(255,255,255,0.1); color: #ccc; border-left: 2px solid #fff; }
        
        .completion { 
            background: rgba(16, 185, 129, 0.15); 
            color: #34d399; 
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .retro { 
            background: linear-gradient(135deg, #f43f5e, #e11d48); 
            color: white; 
            text-align: center; 
            font-weight: 700;
            margin-top: auto;
        }

        /* --- THEMES --- */
        .s1 { border-left: 5px solid #06b6d4; } .s1 .day-num { color: #06b6d4; }
        .s2 { border-left: 5px solid #8b5cf6; } .s2 .day-num { color: #8b5cf6; }
        .s3 { border-left: 5px solid #ec4899; } .s3 .day-num { color: #ec4899; }
        .s4 { border-left: 5px solid #f97316; } .s4 .day-num { color: #f97316; }
        .s5 { border-left: 5px solid #eab308; } .s5 .day-num { color: #eab308; }
        .s6 { border-left: 5px solid #22c55e; } .s6 .day-num { color: #22c55e; }
        .s7 { border-left: 5px solid #ef4444; } .s7 .day-num { color: #ef4444; }

    </style>
</head>
<body>

    <header>
        <h1>900-Day Project Roadmap</h1>
        <p class="subtitle">Macro Timeline Divided by 7 Sprints (~128 Days per Phase)</p>
    </header>

    <div id="timeline-container"></div>

    <script>
        // Configuration: 900 Days / 7 Sprints = ~128 days per sprint
        const SPRINT_DURATION = 128;
        const START_DATE = new Date("2025-01-26");

        const sprintsData = [
            {
                id: 1, theme: "s1",
                stories: [
                    { finishDay: 25, name: "Registration Logic" },
                    { finishDay: 50, name: "Login & Security" },
                    { finishDay: 85, name: "Error Handling" },
                    { finishDay: 110, name: "Reset Password" }
                ]
            },
            {
                id: 2, theme: "s2",
                stories: [
                    { finishDay: 30, name: "Profile Management" },
                    { finishDay: 60, name: "Cab Search Core" },
                    { finishDay: 90, name: "Route Preview Map" },
                    { finishDay: 115, name: "Price Estimation" }
                ]
            },
            {
                id: 3, theme: "s3",
                stories: [
                    { finishDay: 20, name: "Cab Selection UI" },
                    { finishDay: 65, name: "Driver Confirm & OTP" },
                    { finishDay: 105, name: "Live Driver Tracking" }
                ]
            },
            {
                id: 4, theme: "s4",
                stories: [
                    { finishDay: 45, name: "OTP Verification" },
                    { finishDay: 80, name: "Share Live Trip" },
                    { finishDay: 110, name: "Cancel Trip Logic" }
                ]
            },
            {
                id: 5, theme: "s5",
                stories: [
                    { finishDay: 40, name: "Arrival Notification" },
                    { finishDay: 85, name: "Payment Gateway" },
                    { finishDay: 115, name: "Success Screens" }
                ]
            },
            {
                id: 6, theme: "s6",
                stories: [
                    { finishDay: 50, name: "Captain Rating" },
                    { finishDay: 80, name: "Bill Emailer" },
                    { finishDay: 115, name: "Emergency SOS" }
                ]
            },
            {
                id: 7, theme: "s7",
                stories: [
                    { finishDay: 55, name: "Support Chat" },
                    { finishDay: 90, name: "Driver Requests" },
                    { finishDay: 120, name: "Doc Upload" }
                ]
            }
        ];

        const container = document.getElementById('timeline-container');

        // Helper: Add days to a date
        function addDays(date, days) {
            const result = new Date(date);
            result.setDate(result.getDate() + days);
            return result;
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }

        // Render Loop
        sprintsData.forEach((sprint, index) => {
            // Calculate Sprint Start/End based on cumulative 128-day blocks
            const sprintStart = addDays(START_DATE, index * SPRINT_DURATION);
            const sprintEnd = addDays(sprintStart, SPRINT_DURATION);

            // Create Sprint Container
            const section = document.createElement('div');
            section.className = `sprint-row ${sprint.theme}`;
            section.innerHTML = `
                <div class="sprint-info">
                    <div class="sprint-title">
                        Sprint ${sprint.id}
                    </div>
                    <div class="duration-badge">
                        ${formatDate(sprintStart)} - ${formatDate(sprintEnd)} (${SPRINT_DURATION} Days)
                    </div>
                </div>
                <div class="timeline-grid" id="grid-${sprint.id}"></div>
            `;
            container.appendChild(section);

            const grid = section.querySelector(`#grid-${sprint.id}`);

            // --- GENERATE CARDS FOR KEY DAYS ONLY ---
            
            // 1. Day 1 (Kickoff)
            createCard(grid, 1, sprintStart, `<div class="event kickoff">🚀 Sprint Planning</div>`);

            // 2. Story Completion Days
            sprint.stories.forEach(story => {
                const storyDate = addDays(sprintStart, story.finishDay);
                createCard(grid, story.finishDay, storyDate, `
                    <div class="event completion">✅ ${story.name}</div>
                    <div style="font-size:0.65rem; opacity:0.6; margin-top:5px;">Feature Complete</div>
                `);
            });

            // 3. Spacers (Optional - to fill grid visually if needed, skipping for density)

            // 4. Last Day (Retro)
            const retroDate = addDays(sprintStart, SPRINT_DURATION);
            createCard(grid, SPRINT_DURATION, retroDate, `<div class="event retro">🎉 Retrospective</div>`);
        });

        function createCard(targetGrid, dayNum, dateObj, contentHtml) {
            const card = document.createElement('div');
            card.className = 'day-card';
            card.innerHTML = `
                <div class="day-header">
                    <span class="day-num">Day ${dayNum}</span>
                    <span class="day-label">${formatDate(dateObj)}</span>
                </div>
                <div>${contentHtml}</div>
            `;
            targetGrid.appendChild(card);
        }

    </script>

</body>
</html>
